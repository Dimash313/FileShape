name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep all main checks, but cancel obsolete PR runs on newer commits.
# This saves hosted-runner time without skipping checks for the latest PR head.
concurrency:
  group: fileshape-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Reject accidentally committed credentials
        run: python tools/secret_scan.py
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q main.py config.py api services tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build --tag fileshape:ci .

  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test background job tracking
        run: npm test
      - name: Typecheck and build Mini App
        run: npm run build
